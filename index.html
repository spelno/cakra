<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SI CAKRA</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: radial-gradient(circle at top right, #064e3b, #022c22);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Animasi Floating Karakter Cakra */
        .karakter-cakra-anim {
            animation: floatKarakter 4s ease-in-out infinite;
        }

        @keyframes floatKarakter {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }

        .input-cakra {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-cakra:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #10b981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
        }

        .btn-cakra {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            transition: all 0.3s ease;
        }

        .btn-cakra:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body class="p-6">

    <div class="w-full max-w-[460px] relative">
        <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-64 h-64 karakter-cakra-anim z-20">
            <img src="Karakter.png" id="siCakraImage" class="w-full h-full object-contain drop-shadow-2xl" alt="Karakter SI CAKRA">
        </div>

        <div class="glass-card p-10 pt-28 text-white relative overflow-hidden">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-extrabold tracking-tight">SI CAKRA</h1>
                <p class="text-emerald-400/60 text-[10px] uppercase tracking-[0.4em] font-bold mt-1">Sistem Informasi Penomoran Surat</p>
            </div>

            <div id="bubble" class="bg-emerald-950/40 border border-emerald-500/20 p-4 rounded-2xl mb-8 text-sm text-center italic text-emerald-100">
                "Selamat datang! Aku SI CAKRA. Masukkan aksesmu untuk masuk ke dashboard."
            </div>

            <div class="space-y-6">
                <div>
                    <label class="block text-[11px] font-bold text-emerald-400 uppercase tracking-widest ml-1 mb-2">User Identity</label>
                    <div class="relative">
                        <i data-lucide="user" class="absolute left-4 top-4 w-5 h-5 text-emerald-500/40"></i>
                        <input type="text" id="username" placeholder="Username" 
                            class="w-full input-cakra pl-12 pr-4 py-4 rounded-2xl text-white outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-emerald-400 uppercase tracking-widest ml-1 mb-2">Access Key</label>
                    <div class="relative">
                        <i data-lucide="key-round" class="absolute left-4 top-4 w-5 h-5 text-emerald-500/40"></i>
                        <input type="password" id="password" placeholder="••••••••" 
                            class="w-full input-cakra pl-12 pr-4 py-4 rounded-2xl text-white outline-none">
                    </div>
                </div>

                <button onclick="handleLogin()" id="btnLogin" 
                    class="w-full btn-cakra text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-3 mt-4">
                    <span>MASUK KE SISTEM</span>
                    <i data-lucide="log-in" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="mt-10 text-center border-t border-white/5 pt-6">
                <p class="text-[10px] text-white/20 uppercase tracking-[0.5em] font-medium">Official Access Point</p>
                <p class="text-xs font-bold text-emerald-500/50 mt-1">YAYASAN CAKRA PROLETARIAT</p>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Gunakan URL Deployment Google Apps Script Anda
        const API_URL = "https://script.google.com/macros/s/AKfycbyEB6BcojpLM0MqQonBzjx4m8bwllz_e9G67nO0R9Vhn0J_y8tm52ckGIrXgX8fuUbh/exec";

        async function handleLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const bubble = document.getElementById('bubble');
            const btn = document.getElementById('btnLogin');

            if(!u || !p) {
                bubble.innerText = "😐 Lengkapi data loginmu dulu ya!";
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> <span>MENGOTENTIKASI...</span>`;
            bubble.innerText = "⏳ Sebentar, aku cek dulu izin aksesmu...";
            lucide.createIcons();

            try {
                const response = await fetch(`${API_URL}?action=login&u=${u}&p=${p}`);
                const res = await response.json();

                if (res.success) {
                    bubble.innerText = `🎉 Halo ${res.user.nama}! Data cocok. Mengalihkan...`;
                    localStorage.setItem("ycp_user", JSON.stringify(res.user));
                    
                    setTimeout(() => {
                        // Pengalihan berdasarkan role sesuai template dashboard
                        if (res.user.role === "DIREKTUR" || res.user.role === "ADMIN") {
                            window.location.href = "dashboard.html";
                        } else {
                            window.location.href = "anggota.html";
                        }
                    }, 1200);
                } else {
                    bubble.innerText = "❌ Akses ditolak. Pastikan username dan password benar.";
                    btn.disabled = false;
                    btn.innerHTML = `<span>MASUK KE SISTEM</span> <i data-lucide="log-in" class="w-5 h-5"></i>`;
                    lucide.createIcons();
                }
            } catch (err) {
                bubble.innerText = "⚠️ Gangguan koneksi. Coba lagi nanti!";
                btn.disabled = false;
                btn.innerHTML = `<span>MASUK KE SISTEM</span> <i data-lucide="log-in" class="w-5 h-5"></i>`;
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
