<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Internal - Cakra Proletariat</title>
    
    <!-- Link External (Membutuhkan Internet) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #0f172a;
            overflow: hidden;
            color: white;
        }

        /* Dekorasi Animasi Latar Belakang */
        .background-animate {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1e3a8a 0%, #0f172a 100%);
            z-index: -1;
        }

        .orb {
            position: absolute;
            width: 400px; height: 400px;
            background: rgba(37, 99, 235, 0.15);
            filter: blur(80px);
            border-radius: 50%;
            animation: float 15s infinite alternate;
        }

        @keyframes float {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(30%, 30%); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-field {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .input-field:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="background-animate">
        <div class="orb"></div>
    </div>

    <!-- MAIN LOGIN CARD -->
    <div class="w-full max-w-[420px] glass-card rounded-[3rem] p-10 relative overflow-hidden">
        
        <!-- Header Section -->
        <div class="text-center mb-10">
            <div class="inline-flex p-4 rounded-3xl bg-blue-600/20 border border-blue-500/30 mb-6 shadow-inner">
                <i data-lucide="scale" class="w-10 h-10 text-blue-400"></i>
            </div>
            <h1 class="text-3xl font-bold tracking-tight text-white">Cakra Proletariat</h1>
            <p class="text-blue-300/40 text-[10px] uppercase tracking-[0.3em] mt-2 font-bold italic">Legal Management System</p>
        </div>

        <!-- Form Section -->
        <div class="space-y-6">
            <div class="space-y-2">
                <label class="text-[11px] font-bold text-blue-400/70 uppercase tracking-widest ml-1">Identity</label>
                <div class="relative">
                    <i data-lucide="user-circle" class="absolute left-4 top-4 w-5 h-5 text-blue-400/40"></i>
                    <input type="text" id="username" 
                        class="w-full input-field pl-12 pr-4 py-4 rounded-2xl outline-none text-white placeholder-blue-300/20" 
                        placeholder="Username">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[11px] font-bold text-blue-400/70 uppercase tracking-widest ml-1">Security Key</label>
                <div class="relative">
                    <i data-lucide="lock" class="absolute left-4 top-4 w-5 h-5 text-blue-400/40"></i>
                    <input type="password" id="password" 
                        class="w-full input-field pl-12 pr-4 py-4 rounded-2xl outline-none text-white placeholder-blue-300/20" 
                        placeholder="••••••••">
                </div>
            </div>

            <button onclick="handleLogin()" id="btnLogin" 
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-3 mt-8 shadow-xl shadow-blue-900/40 transition-all active:scale-95">
                <span>MASUK KE SISTEM</span>
                <i data-lucide="chevron-right" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Branding Footer -->
        <div class="mt-12 text-center border-t border-white/5 pt-6">
            <p class="text-[10px] text-white/20 uppercase tracking-[0.4em] font-medium">Digital Solution by</p>
            <p class="text-sm font-bold text-blue-400/60 mt-1 italic tracking-wide">Notes of OD</p>
        </div>
    </div>

    <script>
        // Inisialisasi Ikon Lucide
        lucide.createIcons();

        // API URL dari Google Apps Script Anda (Sesuai image_99a8bb.png)
        const API_URL = "https://script.google.com/macros/s/AKfycbzJQ3IOh1luGmUZpMwk2xWqusobMf6AwwPgkzejXwwninByd7WFUMPjPz35AJca27Di/exec";

        async function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('btnLogin');

            if (!user || !pass) {
                alert("Mohon masukkan Username dan Password!");
                return;
            }

            // Animasi Loading
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> <span>MENGOTENTIKASI...</span>`;
            lucide.createIcons();

            try {
                // Fetch data dari Google Apps Script
                const response = await fetch(`${API_URL}?action=login&u=${user}&p=${pass}`);
                const res = await response.json();

                if (res.success) {
                    // Simpan data user ke Local Storage browser
                    localStorage.setItem("ycp_user", JSON.stringify(res.user));

                    // Pengalihan Berdasarkan Role (Direktur/User)
                    if (res.user.role === "DIREKTUR") {
                        window.location.href = "direktur.html";
                    } else if (res.user.role === "USER") {
                        window.location.href = "anggota.html";
                    } else {
                        window.location.href = "guest.html";
                    }
                } else {
                    alert("Akses Ditolak: " + res.message);
                }
            } catch (error) {
                alert("Kesalahan Jaringan: Pastikan Web App GAS sudah di-deploy sebagai 'Anyone'.");
                console.error(error);
            }

            // Kembalikan tombol jika gagal
            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
            btn.innerHTML = `<span>MASUK KE SISTEM</span> <i data-lucide="chevron-right" class="w-5 h-5"></i>`;
            lucide.createIcons();
        }
    </script>
</body>
</html>
