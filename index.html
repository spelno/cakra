<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem SI CAKRA | Yayasan Cakra Proletariat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #022c22; 
            overflow: hidden; 
        }
        
        .glass-card { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(25px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 2.5rem; 
        }
        
        /* Solusi agar Logo tidak tumpang tindih dengan BG gelap */
        .logo-container {
            position: relative;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            padding: 1rem;
        }

        #splash { transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .floating { animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        
        .hidden-login { opacity: 0; transform: translateY(20px); pointer-events: none; transition: all 0.6s ease; }
        .show-login { opacity: 1 !important; transform: translateY(0) !important; pointer-events: auto !important; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div id="splash" class="fixed inset-0 z-50 bg-[#022c22] flex flex-col items-center justify-center text-center">
        <div class="w-64 h-64 floating mb-6">
            <img src="karakter.png" class="w-full h-full object-contain" alt="Si Cakra">
        </div>
        <div id="greeting" class="text-emerald-400 text-xl font-bold tracking-[0.2em] opacity-0 transition-opacity duration-1000">
            MEMPERSIAPKAN SISTEM...
        </div>
    </div>

    <div id="loginPage" class="w-full max-w-[420px] hidden-login relative z-10">
        <div class="glass-card p-10 pt-12 text-white text-center">
            
            <div class="logo-container w-40 h-40 mx-auto mb-6 flex items-center justify-center">
                <img src="logo Si Cakra.png" class="w-full h-full object-contain drop-shadow-[0_0_15px_rgba(251,191,36,0.4)]" alt="Logo SI CAKRA">
            </div>

            <h2 class="text-2xl font-bold mb-1">OTENTIKASI AKSES</h2>
            <p class="text-emerald-400/60 text-[9px] tracking-[0.3em] uppercase mb-8 font-semibold">Legal Management System</p>

            <div class="space-y-4 text-left">
                <div class="relative">
                    <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-emerald-500/40"></i>
                    <input type="text" id="u" placeholder="Username" class="w-full bg-white/5 border border-white/10 pl-12 pr-4 py-3.5 rounded-2xl outline-none focus:border-emerald-500/50 transition-all text-sm">
                </div>
                <div class="relative">
                    <i data-lucide="shield-lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-emerald-500/40"></i>
                    <input type="password" id="p" placeholder="Password" class="w-full bg-white/5 border border-white/10 pl-12 pr-4 py-3.5 rounded-2xl outline-none focus:border-emerald-500/50 transition-all text-sm">
                </div>
                <button onclick="handleLogin()" id="btn" class="w-full bg-gradient-to-r from-emerald-500 to-emerald-700 py-4 rounded-2xl font-bold mt-4 shadow-lg shadow-emerald-900/20 active:scale-95 transition-all text-sm">
                    MASUK KE DASHBOARD
                </button>
            </div>
            
            <p class="mt-10 text-[10px] text-white/30 tracking-widest uppercase font-bold">
                Yayasan Cakra Proletariat Bitung Indonesia
            </p>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Alur Splash ke Login
        window.onload = () => {
            setTimeout(() => { document.getElementById('greeting').style.opacity = '1'; }, 500);
            setTimeout(() => {
                const splash = document.getElementById('splash');
                splash.style.opacity = '0';
                splash.style.transform = 'scale(1.05)';
                setTimeout(() => { 
                    splash.classList.add('hidden');
                    document.getElementById('loginPage').classList.add('show-login');
                }, 800);
            }, 2500);
        };

        const API = "https://script.google.com/macros/s/AKfycbyEB6BcojpLM0MqQonBzjx4m8bwllz_e9G67nO0R9Vhn0J_y8tm52ckGIrXgX8fuUbh/exec"; 

        async function handleLogin() {
            const u = document.getElementById('u').value;
            const p = document.getElementById('p').value;
            const btn = document.getElementById('btn');

            if(!u || !p) return;

            btn.disabled = true;
            btn.innerHTML = `<span class="flex items-center justify-center gap-2"><i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> MEMVERIFIKASI...</span>`;
            lucide.createIcons();

            try {
                const res = await fetch(`${API}?action=login&u=${u}&p=${p}`);
                const data = await res.json();

                if(data.success) {
                    localStorage.setItem("user_cakra", JSON.stringify(data.user));
                    window.location.href = "dashboard.html"; 
                } else {
                    alert("Akses Ditolak! Periksa kembali kredensial Anda.");
                    resetBtn();
                }
            } catch (e) {
                alert("Gangguan Server!");
                resetBtn();
            }
        }

        function resetBtn() {
            const btn = document.getElementById('btn');
            btn.disabled = false;
            btn.innerText = "MASUK KE DASHBOARD";
        }
    </script>
</body>
</html>
