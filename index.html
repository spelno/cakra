<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SI CAKRA</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: radial-gradient(circle at top right, #064e3b, #022c22);
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2.5rem;
        }

        .si-cakra-floating {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .btn-cakra {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
            transition: all 0.3s ease;
        }

        .btn-cakra:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 25px rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body class="p-6">

    <div class="w-full max-w-[450px] relative">
        <div class="absolute -top-32 left-1/2 -translate-x-1/2 w-56 h-56 si-cakra-floating z-10">
            <img src="SiCakra.png" id="imgCakra" class="w-full h-full object-contain drop-shadow-2xl" alt="Logo SI CAKRA">
        </div>

        <div class="glass-card p-10 pt-24 text-white relative">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold tracking-tight">SI CAKRA</h1>
                <p class="text-emerald-400/60 text-[10px] uppercase tracking-[0.3em] font-bold mt-1">Sistem Informasi Penomoran Surat</p>
            </div>

            <div id="bubble" class="bg-white/10 p-4 rounded-2xl mb-8 border border-white/5 text-sm text-center italic text-emerald-100">
                "Selamat datang! Silakan masukkan akses untuk mulai mengelola surat."
            </div>

            <div class="space-y-5">
                <div class="relative">
                    <i data-lucide="user" class="absolute left-4 top-4 w-5 h-5 text-emerald-400/40"></i>
                    <input type="text" id="username" placeholder="Username" 
                        class="w-full bg-white/5 border border-white/10 pl-12 pr-4 py-4 rounded-2xl text-white outline-none focus:border-emerald-500 transition-all">
                </div>

                <div class="relative">
                    <i data-lucide="key-round" class="absolute left-4 top-4 w-5 h-5 text-emerald-400/40"></i>
                    <input type="password" id="password" placeholder="Password" 
                        class="w-full bg-white/5 border border-white/10 pl-12 pr-4 py-4 rounded-2xl text-white outline-none focus:border-emerald-500 transition-all">
                </div>

                <button onclick="handleLogin()" id="btnLogin" 
                    class="w-full btn-cakra text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-3 mt-6">
                    <span>OTENTIKASI</span>
                    <i data-lucide="shield-check" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="mt-10 text-center border-t border-white/5 pt-6">
                <p class="text-[10px] text-white/20 uppercase tracking-[0.4em] font-medium">Internal System Access</p>
                <p class="text-xs font-bold text-emerald-400/60 mt-1">YAYASAN CAKRA PROLETARIAT</p>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const API_URL = "https://script.google.com/macros/s/AKfycbzRwyrAH89OZ2ksRK9cA4-VCL2BD9LIIxw01_FSZKrfjtREUPx_1FS1mtYl1RG_T3g/exec";

        async function handleLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const bubble = document.getElementById('bubble');
            const btn = document.getElementById('btnLogin');

            if(!u || !p) {
                bubble.innerText = "😐 Masukkan username dan password Anda terlebih dahulu.";
                return;
            }

            btn.disabled = true;
            bubble.innerText = "⏳ Sedang memverifikasi data, mohon tunggu...";

            try {
                const response = await fetch(`${API_URL}?action=login&u=${u}&p=${p}`);
                const res = await response.json();

                if (res.success) {
                    bubble.innerText = "🎉 Akses diberikan. Mengalihkan ke halaman utama...";
                    localStorage.setItem("ycp_user", JSON.stringify(res.user));
                    
                    setTimeout(() => {
                        window.location.href = res.user.role === "DIREKTUR" ? "direktur.html" : "anggota.html";
                    }, 1000);
                } else {
                    bubble.innerText = "❌ Maaf, kredensial salah. Coba periksa kembali.";
                }
            } catch (err) {
                bubble.innerText = "⚠️ Terjadi kesalahan koneksi ke server.";
            }

            btn.disabled = false;
        }
    </script>
</body>
</html>
