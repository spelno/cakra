<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Yayasan Cakra Proletariat</title>
    <!-- Tailwind CSS untuk desain modern & mobile-friendly -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons untuk ikon profesional -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .glass-card { background: white; border: 1px solid #e2e8f0; border-radius: 2rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        .btn-login { background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%); transition: all 0.3s; }
        .btn-login:active { transform: scale(0.98); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-md glass-card p-8 space-y-8">
        <!-- Logo & Title -->
        <div class="text-center">
            <div class="bg-blue-600 w-16 h-16 rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-lg shadow-blue-200">
                <i data-lucide="scale" class="text-white w-8 h-8"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Cakra Proletariat</h1>
            <p class="text-slate-500 text-sm italic">Sistem Manajemen Perkara & Hukum</p>
        </div>

        <!-- Login Form -->
        <div class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase ml-1 mb-1 tracking-wider">Username</label>
                <div class="relative">
                    <i data-lucide="user" class="absolute left-3 top-3 w-5 h-5 text-slate-300"></i>
                    <input type="text" id="username" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-slate-700" placeholder="Masukkan username">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase ml-1 mb-1 tracking-wider">Password</label>
                <div class="relative">
                    <i data-lucide="lock" class="absolute left-3 top-3 w-5 h-5 text-slate-300"></i>
                    <input type="password" id="password" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-slate-700" placeholder="••••••••">
                </div>
            </div>

            <button onclick="handleLogin()" id="btnLogin" class="w-full btn-login text-white font-bold py-4 rounded-xl shadow-lg flex items-center justify-center gap-2 mt-6">
                <span>Masuk Ke Sistem</span>
                <i data-lucide="log-in" class="w-5 h-5"></i>
            </button>
        </div>

        <div class="text-center pt-4">
            <p class="text-[10px] text-slate-400 font-medium uppercase tracking-widest">Official Branding by</p>
            <p class="text-xs font-bold text-blue-600 italic">Notes of OD</p>
        </div>
    </div>

    <script>
        // Gunakan URL Web App dari GAS Anda
        const API_URL = "https://script.google.com/macros/s/AKfycbzJQ3IOh1luGmUZpMwk2xWqusobMf6AwwPgkzejXwwninByd7WFUMPjPz35AJca27Di/exec";

        async function handleLogin() {
            const userVal = document.getElementById('username').value;
            const passVal = document.getElementById('password').value;
            const btn = document.getElementById('btnLogin');

            if(!userVal || !passVal) {
                alert("Mohon isi username dan password!");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> <span>Memverifikasi...</span>`;
            lucide.createIcons();

            try {
                // Request ke Google Apps Script
                const response = await fetch(`${API_URL}?action=login&u=${userVal}&p=${passVal}`);
                const res = await response.json();

                if (res.success) {
                    // Simpan identitas user di LocalStorage
                    localStorage.setItem("ycp_user", JSON.stringify(res.user));

                    // Pengalihan berdasarkan ROLE dari Database
                    if (res.user.role === "DIREKTUR") {
                        window.location.href = "direktur.html";
                    } else if (res.user.role === "USER") {
                        window.location.href = "anggota.html";
                    } else {
                        window.location.href = "guest.html";
                    }
                } else {
                    alert("Gagal: " + res.message);
                }
            } catch (e) {
                alert("Kesalahan Koneksi: Pastikan Web App sudah di-deploy sebagai 'Anyone'.");
            }

            btn.disabled = false;
            btn.innerHTML = `<span>Masuk Ke Sistem</span> <i data-lucide="log-in" class="w-5 h-5"></i>`;
            lucide.createIcons();
        }

        // Inisialisasi ikon Lucide
        lucide.createIcons();
    </script>
</body>
</html>
