<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem SI CAKRA | Yayasan Cakra Proletariat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #022c22; overflow: hidden; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 2.5rem; }
        
        /* Animasi Splash */
        #splash { transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .floating { animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        
        .hidden-login { opacity: 0; transform: translateY(20px); pointer-events: none; transition: all 0.6s ease; }
        .show-login { opacity: 1 !important; transform: translateY(0) !important; pointer-events: auto !important; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div id="splash" class="fixed inset-0 z-50 bg-[#022c22] flex flex-col items-center justify-center">
        <div class="w-64 h-64 floating mb-6">
            <img src="karakter.png" class="w-full h-full object-contain" alt="Si Cakra">
        </div>
        <div id="greeting" class="text-emerald-400 text-xl font-bold tracking-widest opacity-0 transition-opacity duration-1000">
            SELAMAT DATANG DI SI CAKRA
        </div>
    </div>

    <div id="loginPage" class="w-full max-w-[420px] hidden-login relative z-10">
        <div class="glass-card p-10 pt-16 text-white text-center">
            <div class="w-32 h-32 mx-auto mb-8">
                <img src="logo Si Cakra.png" class="w-full h-full object-contain" alt="Logo SI CAKRA">
            </div>

            <h2 class="text-2xl font-bold mb-2">OTENTIKASI AKSES</h2>
            <p class="text-emerald-400/50 text-[10px] tracking-[0.4em] uppercase mb-10">Legal Management System</p>

            <div class="space-y-5 text-left">
                <div class="relative">
                    <i data-lucide="user" class="absolute left-4 top-4 w-5 h-5 text-emerald-500/30"></i>
                    <input type="text" id="u" placeholder="Username" class="w-full bg-white/5 border border-white/10 pl-12 pr-4 py-4 rounded-2xl outline-none focus:border-emerald-500 transition-all">
                </div>
                <div class="relative">
                    <i data-lucide="shield-lock" class="absolute left-4 top-4 w-5 h-5 text-emerald-500/30"></i>
                    <input type="password" id="p" placeholder="Password" class="w-full bg-white/5 border border-white/10 pl-12 pr-4 py-4 rounded-2xl outline-none focus:border-emerald-500 transition-all">
                </div>
                <button onclick="handleLogin()" id="btn" class="w-full bg-gradient-to-r from-emerald-500 to-emerald-700 py-4 rounded-2xl font-bold mt-4 hover:scale-[1.02] transition-transform">
                    MASUK KE DASHBOARD
                </button>
            </div>
            
            <p class="mt-10 text-[10px] text-white/20 tracking-widest uppercase">Yayasan Cakra Proletariat</p>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Alur Splash ke Login
        window.onload = () => {
            setTimeout(() => { document.getElementById('greeting').style.opacity = '1'; }, 500);
            setTimeout(() => {
                const splash = document.getElementById('splash');
                splash.style.opacity = '0';
                splash.style.transform = 'scale(1.1)';
                setTimeout(() => { 
                    splash.classList.add('hidden');
                    document.getElementById('loginPage').classList.add('show-login');
                }, 800);
            }, 3000);
        };

        const API = "https://script.google.com/macros/s/AKfycbyEB6BcojpLM0MqQonBzjx4m8bwllz_e9G67nO0R9Vhn0J_y8tm52ckGIrXgX8fuUbh/exec"; // Masukkan URL .exec Anda di sini

        async function handleLogin() {
            const u = document.getElementById('u').value;
            const p = document.getElementById('p').value;
            const btn = document.getElementById('btn');

            if(!u || !p) return alert("Lengkapi data!");

            btn.disabled = true;
            btn.innerText = "MEMVERIFIKASI...";

            try {
                const res = await fetch(`${API}?action=login&u=${u}&p=${p}`);
                const data = await res.json();

                if(data.success) {
                    localStorage.setItem("user_cakra", JSON.stringify(data.user));
                    window.location.href = "dashboard.html"; // Mengarah ke template dashboard
                } else {
                    alert("Akses Ditolak!");
                    btn.disabled = false;
                    btn.innerText = "MASUK KE DASHBOARD";
                }
            } catch (e) {
                alert("Gangguan Server!");
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
