<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Anggota - YCP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .card-shadow { box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); }
        .blue-gradient { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); }
    </style>
</head>
<body class="pb-20">

    <!-- PROTEKSI SESSION (Hanya Anggota/USER) -->
    <script>
        const user = JSON.parse(localStorage.getItem("ycp_user"));
        if (!user || user.role !== "USER") {
            window.location.href = "index.html"; // Tendang balik ke login jika bukan role USER
        }
    </script>

    <!-- HEADER & PROFIL -->
    <header class="blue-gradient text-white p-6 rounded-b-[2.5rem] shadow-lg mb-6">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-sm opacity-80 uppercase tracking-widest font-semibold">Selamat Bekerja,</h1>
                <p id="dispName" class="text-xl font-bold italic">Nama Anggota</p>
            </div>
            <div class="relative">
                <img id="dispFoto" src="https://via.placeholder.com/150" class="w-14 h-14 rounded-full border-2 border-white/50 object-cover shadow-md">
                <button onclick="document.getElementById('uploadInput').click()" class="absolute -bottom-1 -right-1 bg-white p-1 rounded-full text-blue-600 shadow-sm border border-blue-100">
                    <i data-lucide="camera" class="w-3 h-3"></i>
                </button>
                <input type="file" id="uploadInput" class="hidden" accept="image/*" onchange="handlePhotoUpload(this)">
            </div>
        </div>
        
        <!-- Info Ringkas Jabatan -->
        <div class="bg-white/10 backdrop-blur-md p-3 rounded-2xl flex items-center gap-3">
            <i data-lucide="award" class="w-5 h-5"></i>
            <span id="dispJabatan" class="text-sm font-medium italic uppercase">Jabatan Anggota</span>
        </div>
    </header>

    <main class="px-5 space-y-6">
        <!-- SEKSI PERKARA SAYA -->
        <div class="flex items-center justify-between mb-2">
            <h2 class="text-slate-800 font-bold text-lg flex items-center gap-2">
                <i data-lucide="briefcase" class="text-blue-600 w-5 h-5"></i>
                Perkara Saya
            </h2>
            <span class="text-xs font-bold text-blue-600 bg-blue-100 px-2 py-1 rounded-lg" id="caseCount">0 Kasus</span>
        </div>

        <!-- Container List Perkara -->
        <div id="caseList" class="space-y-4">
            <!-- Loading State -->
            <div class="bg-white p-4 rounded-2xl animate-pulse flex flex-col gap-3 border border-slate-200">
                <div class="h-4 bg-slate-200 rounded w-1/2"></div>
                <div class="h-3 bg-slate-100 rounded w-full"></div>
            </div>
        </div>
    </main>

    <!-- NAVIGASI BAWAH (Mobile Menu) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-6 py-3 flex justify-between items-center z-50">
        <button class="flex flex-col items-center gap-1 text-blue-600">
            <i data-lucide="home" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Beranda</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-slate-400" onclick="alert('Fitur Surat Segera Hadir')">
            <i data-lucide="file-text" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Surat</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-slate-400" onclick="logout()">
            <i data-lucide="log-out" class="w-6 h-6 text-red-400"></i>
            <span class="text-[10px] font-bold uppercase text-red-400">Keluar</span>
        </button>
    </nav>

    <!-- MODAL ASISTEN HUKUM -->
    <div id="modalSaran" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] flex items-end justify-center">
        <div class="bg-white w-full rounded-t-[2.5rem] p-8 space-y-5 animate-slide-up shadow-2xl border-t border-blue-100">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-2"></div>
            <div class="flex justify-between items-start">
                <h3 class="text-blue-700 font-bold text-xl flex items-center gap-2">
                    <i data-lucide="sparkles" class="w-6 h-6"></i>
                    Saran Strategi
                </h3>
                <button onclick="closeModal()" class="p-2 bg-slate-100 rounded-full"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div id="txtSaran" class="text-slate-700 leading-relaxed italic bg-blue-50 p-5 rounded-2xl border border-blue-100">
                Memuat saran...
            </div>
            <button class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2" onclick="closeModal()">
                <i data-lucide="check-circle" class="w-5 h-5"></i>
                Siap, Saya Mengerti
            </button>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzJQ3IOh1luGmUZpMwk2xWqusobMf6AwwPgkzejXwwninByd7WFUMPjPz35AJca27Di/exec"; // Ganti dengan URL GAS Anda
        
        // Inisialisasi Data Tampilan
        document.getElementById('dispName').innerText = user.nama;
        document.getElementById('dispJabatan').innerText = user.jabatan;
        if(user.foto) document.getElementById('dispFoto').src = user.foto;

        async function loadData() {
            try {
                const res = await fetch(`${API_URL}?action=getPerkara&role=${user.role}&nama=${user.nama}`);
                const data = await res.json();
                renderCases(data);
            } catch (e) {
                console.error("Gagal load data", e);
            }
        }

        function renderCases(cases) {
            const list = document.getElementById('caseList');
            document.getElementById('caseCount').innerText = `${cases.length} Kasus`;
            
            if(cases.length === 0) {
                list.innerHTML = `<div class="text-center py-10 text-slate-400 text-sm">Tidak ada perkara yang ditugaskan ke Anda.</div>`;
                return;
            }

            list.innerHTML = cases.map(c => `
                <div class="bg-white p-5 rounded-[1.5rem] border border-slate-200 shadow-sm active:scale-95 transition-all cursor-pointer" onclick="showSaran('${c.saran_hukum.replace(/'/g, "\\'")}')">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-[10px] bg-slate-100 px-2 py-1 rounded-md text-slate-500 font-bold tracking-wider uppercase">${c.id_reg}</span>
                        <span class="text-[10px] bg-blue-100 px-2 py-1 rounded-md text-blue-600 font-bold uppercase">${c.manual || c.sipp || 'Proses'}</span>
                    </div>
                    <h3 class="font-bold text-slate-800 mb-1">${c.klien}</h3>
                    <p class="text-xs text-slate-400 flex items-center gap-1 italic">
                        <i data-lucide="tag" class="w-3 h-3"></i> ${c.jenis}
                    </p>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function showSaran(msg) {
            document.getElementById('txtSaran').innerText = msg;
            document.getElementById('modalSaran').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modalSaran').classList.add('hidden');
        }

        async function handlePhotoUpload(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            const reader = new FileReader();
            
            document.getElementById('dispFoto').classList.add('animate-pulse');
            
            reader.onload = async function(e) {
                const base64 = e.target.result;
                try {
                    // Panggil GAS untuk simpan ke Drive
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'uploadFoto',
                            base64: base64,
                            userId: user.id,
                            userName: user.nama
                        })
                    });
                    const result = await res.json();
                    if(result.success) {
                        document.getElementById('dispFoto').src = result.url;
                        user.foto = result.url;
                        localStorage.setItem("ycp_user", JSON.stringify(user));
                    }
                } catch(err) { alert("Gagal upload foto"); }
                document.getElementById('dispFoto').classList.remove('animate-pulse');
            };
            reader.readAsDataURL(file);
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        loadData();
        lucide.createIcons();
    </script>
</body>
</html>
